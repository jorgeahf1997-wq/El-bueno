<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Sem conexão - PreçoCerto Brasil</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --brand: #0b5fff;
        --brand-dark: #0847c2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1019;
          --surface: #131a27;
          --ink: #eef2f8;
          --muted: #b1bbcf;
          --line: #2a3548;
          --brand: #0b5fff;
          --brand-dark: #3a7bff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
      }
      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-weight: 800;
        font-size: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-dark);
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">R$</div>
      <h1>Você está sem conexão</h1>
      <p>
        O PreçoCerto precisa de internet para buscar os preços nas lojas. Não mostramos preços antigos como se fossem
        de agora. Conecte-se e tente de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
